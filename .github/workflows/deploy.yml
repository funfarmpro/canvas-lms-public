name: "Canvas build and deploy"
on:
  workflow_dispatch:
  push:
    branches: 
      - funfarm
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'ui/**'
      - 'packages/**'

env:
  REGISTRY: ghcr.io
  API: funfarmpro/canvas-lms
  CONFIG_REPO: funfarmpro/canvas-lms-config.git
  TAG: ${{ github.sha }}
  APP_ENV: development

jobs:
  setenv:
    runs-on: ubuntu-latest
    outputs:
      TGT_ENV: ${{ steps.assign.outputs.TGT_ENV }}
    environment: "development"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set env variable
        id: assign
        run: |
          if [[ "${{ github.ref_name }}" == "funfarm" ]]; then
            echo "TGT_ENV=development" >> "$GITHUB_OUTPUT"
          else
            TGT_ENV=`echo ${{ github.ref_name }} | sed 's/-lkapi$//g' | sed -e 's|/|-|g' -e 's|_|-|g'`
            echo "TGT_ENV=${TGT_ENV}" >> "$GITHUB_OUTPUT"
          fi

  package:
    runs-on: ubuntu-latest
    if: ${{ ! startsWith(github.ref, 'refs/tags/production') }}
    needs: [ setenv ]
    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Canvas
        env:
          TGT_ENV: ${{ needs.setenv.outputs.TGT_ENV }}
        uses: docker/build-push-action@v3
        with:
          file: ./Dockerfile.production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.API }}:${{ env.TAG }}, ${{ env.REGISTRY }}/${{ env.API }}:${{ env.TGT_ENV }}

  commit_api2env:
    name: Commit API to APP_ENV
    needs: [setenv, package]
    if: false
    #if: ${{ success() || needs.package.result == 'skipped' }}
    runs-on: ubuntu-latest
    environment: "development"
    concurrency: "api"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Commit API
        uses: ./.github/actions/commit_to_config_repo
        with:
          image: ${{ env.API }}
          target_repo: ${{ env.CONFIG_REPO }}
          target_env: ${{ needs.setenv.outputs.TGT_ENV }}
          gh_token: ${{ secrets.GHCR_RW_PAT }}
